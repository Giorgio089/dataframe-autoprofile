[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataframe-autoprofile"
version = "0.1.0"
description = "LLM-free automatic profiling of pandas DataFrames, plus cleaning of currency/percent strings (EU and US formats)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.23"]
keywords = ["pandas", "profiling", "data-quality", "eda", "outliers"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/autoprofile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
